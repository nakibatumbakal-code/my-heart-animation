
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Heart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #101020;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .heart {
            font-size: 160px;
            color: #ff3366;
            animation: heartbeat 1s infinite;
            filter: drop-shadow(0 0 25px #ff3366);
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            margin-top: 20px;
            font-size: 25px;
            letter-spacing: 3px;
            text-align: center;
            min-height: 35px;
        }

        p {
            margin-top: 15px;
            color: #ff99bb;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="heart">♥</div>

    <h1 id="message"></h1>

    <p>A little message for you ❤️</p>

    <script>

        const message = "YOU ARE SPECIAL";
        let index = 0;

        function typeText() {

            if (index < message.length) {

                document.getElementById("message").textContent +=
                    message[index];

                index++;

                setTimeout(typeText, 150);
            }

        }

        setTimeout(typeText, 1000);

    </script>

</body>
</html>
